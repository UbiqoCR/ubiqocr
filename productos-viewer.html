<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UbiqoCR — Visor de productos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;
  --primary:#2563eb;--primary-light:#eff6ff;
  --text:#0f172a;--muted:#64748b;--danger:#dc2626;
  --green:#16a34a;--radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.header{background:#fff;border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100;}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--primary);text-decoration:none;}
.header-title{font-size:.85rem;color:var(--muted);margin-left:.5rem;}

/* MAIN LAYOUT */
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 61px);}

/* SIDEBAR */
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.25rem;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto;}
.sidebar h3{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;}

.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1.25rem;}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light);}
.upload-zone.drag{border-color:var(--primary);background:var(--primary-light);}
.upload-icon{font-size:2rem;margin-bottom:.5rem;}
.upload-label{font-size:.85rem;color:var(--muted);}
.upload-label strong{color:var(--primary);}
#fileInput{display:none;}

.stats-box{background:var(--bg);border-radius:var(--radius);padding:1rem;margin-bottom:1.25rem;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border:none;}
.stat-label{font-size:.8rem;color:var(--muted);}
.stat-val{font-size:.9rem;font-weight:600;color:var(--text);}
.stat-val.green{color:var(--green);}

.filter-group{margin-bottom:1rem;}
.filter-group label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px;}
.filter-group select,.filter-group input{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:#fff;color:var(--text);}
.filter-group select:focus,.filter-group input:focus{outline:none;border-color:var(--primary);}

.stores-list{display:flex;flex-direction:column;gap:.3rem;}
.store-chip{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-radius:8px;cursor:pointer;font-size:.82rem;border:1px solid var(--border);transition:all .15s;}
.store-chip:hover{border-color:var(--primary);color:var(--primary);}
.store-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.store-chip .chip-count{font-size:.7rem;opacity:.75;}

/* MAIN */
.main{padding:1.25rem;}

.toolbar{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap input{width:100%;padding:.6rem 1rem .6rem 2.5rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:#fff;}
.search-wrap input:focus{outline:none;border-color:var(--primary);}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;}
.sort-select{padding:.6rem .75rem;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:#fff;}

.results-meta{font-size:.82rem;color:var(--muted);margin-bottom:.75rem;}
.results-meta strong{color:var(--text);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.875rem;}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s,transform .15s;cursor:default;}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-2px);}
.card-img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);padding:.5rem;}
.card-img-placeholder{width:100%;aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--border);}
.card-body{padding:.75rem;}
.card-store{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--primary);font-weight:600;margin-bottom:.25rem;}
.card-name{font-size:.82rem;font-weight:500;line-height:1.4;margin-bottom:.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-cat{font-size:.7rem;color:var(--muted);margin-bottom:.4rem;}
.card-price{font-size:1rem;font-weight:700;color:var(--text);}
.card-price.no-price{font-size:.8rem;color:var(--muted);font-weight:400;}
.card-link{display:inline-block;margin-top:.4rem;font-size:.72rem;color:var(--primary);text-decoration:none;}
.card-link:hover{text-decoration:underline;}

/* EMPTY / LOADING */
.center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;color:var(--muted);}
.center-msg .icon{font-size:3rem;margin-bottom:1rem;}
.center-msg p{font-size:.95rem;max-width:340px;line-height:1.6;}

/* PAGINATION */
.pagination{display:flex;justify-content:center;align-items:center;gap:.5rem;margin-top:1.5rem;flex-wrap:wrap;}
.page-btn{padding:.4rem .8rem;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:.82rem;transition:all .15s;}
.page-btn:hover{border-color:var(--primary);color:var(--primary);}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}

/* PROGRESS BAR */
.progress-bar{height:3px;background:var(--primary);width:0%;transition:width .3s;position:fixed;top:0;left:0;z-index:200;}

@media(max-width:700px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;}
}
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>

<header class="header">
  <a class="logo" href="#">UbiqoCR</a>
  <span class="header-title">— Visor de productos scraped</span>
  <span id="headerCount" style="margin-left:auto;font-size:.8rem;color:var(--muted);"></span>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>Cargar datos</h3>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📂</div>
      <div class="upload-label">
        <strong>Arrastrá</strong> un JSON aquí<br>o hacé clic para elegir
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" multiple>
    </div>

    <div class="stats-box" id="statsBox" style="display:none;">
      <div class="stat-row"><span class="stat-label">Total productos</span><span class="stat-val green" id="statTotal">0</span></div>
      <div class="stat-row"><span class="stat-label">Con imagen</span><span class="stat-val" id="statImg">0</span></div>
      <div class="stat-row"><span class="stat-label">Con precio</span><span class="stat-val" id="statPrice">0</span></div>
      <div class="stat-row"><span class="stat-label">Tiendas</span><span class="stat-val" id="statStores">0</span></div>
    </div>

    <div class="filter-group">
      <label>Categoría</label>
      <select id="filterCat">
        <option value="">Todas</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Precio máximo (₡)</label>
      <input type="number" id="filterMaxPrice" placeholder="Sin límite" min="0">
    </div>

    <div class="filter-group">
      <label>Tiendas</label>
      <div class="stores-list" id="storesList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Buscar producto…" autocomplete="off">
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="default">Sin ordenar</option>
        <option value="price_asc">Precio ↑</option>
        <option value="price_desc">Precio ↓</option>
        <option value="name_asc">Nombre A–Z</option>
      </select>
    </div>

    <div class="results-meta" id="resultsMeta"></div>
    <div id="grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────
let ALL = [];          // todos los productos cargados
let FILTERED = [];     // después de filtros
let activeStores = new Set();
const PAGE_SIZE = 60;
let currentPage = 1;

// ─── LOAD JSON ───────────────────────────────────────────
function loadFiles(files) {
  let loaded = 0;
  const progress = document.getElementById('progress');
  progress.style.width = '10%';

  const readers = [...files].map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        resolve(Array.isArray(data) ? data : []);
      } catch { resolve([]); }
    };
    reader.onerror = () => resolve([]);
    reader.readAsText(file);
  }));

  Promise.all(readers).then(results => {
    const newProds = results.flat();
    ALL = [...ALL, ...newProds];
    activeStores = new Set(ALL.map(p => p.negocio || p.categoria?.split('/')[0] || 'Sin tienda'));
    progress.style.width = '100%';
    setTimeout(() => progress.style.width = '0%', 600);
    buildUI();
    applyFilters();
  });
}

// ─── BUILD UI ────────────────────────────────────────────
function buildUI() {
  // Stats
  const statsBox = document.getElementById('statsBox');
  statsBox.style.display = 'block';
  document.getElementById('statTotal').textContent = ALL.length.toLocaleString('es-CR');
  document.getElementById('statImg').textContent = ALL.filter(p => p.imagen).length.toLocaleString('es-CR');
  document.getElementById('statPrice').textContent = ALL.filter(p => p.precio != null).length.toLocaleString('es-CR');

  // Tiendas
  const stores = [...new Set(ALL.map(p => p.negocio || 'Sin tienda'))].sort();
  document.getElementById('statStores').textContent = stores.length;
  const storesList = document.getElementById('storesList');
  storesList.innerHTML = '';
  stores.forEach(store => {
    const count = ALL.filter(p => (p.negocio || 'Sin tienda') === store).length;
    const chip = document.createElement('div');
    chip.className = 'store-chip active';
    chip.dataset.store = store;
    chip.innerHTML = `<span>${store}</span><span class="chip-count">${count.toLocaleString('es-CR')}</span>`;
    chip.addEventListener('click', () => {
      if (activeStores.has(store)) activeStores.delete(store);
      else activeStores.add(store);
      chip.classList.toggle('active', activeStores.has(store));
      applyFilters();
    });
    storesList.appendChild(chip);
  });

  // Categorías
  const cats = [...new Set(ALL.map(p => p.categoria).filter(Boolean))].sort();
  const catSel = document.getElementById('filterCat');
  catSel.innerHTML = '<option value="">Todas</option>' +
    cats.map(c => `<option value="${c}">${c}</option>`).join('');

  document.getElementById('headerCount').textContent =
    `${ALL.length.toLocaleString('es-CR')} productos cargados`;
}

// ─── FILTERS ─────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const cat = document.getElementById('filterCat').value;
  const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || Infinity;
  const sort = document.getElementById('sortSelect').value;

  FILTERED = ALL.filter(p => {
    const store = p.negocio || 'Sin tienda';
    if (!activeStores.has(store)) return false;
    if (cat && p.categoria !== cat) return false;
    if (p.precio != null && p.precio > maxPrice) return false;
    if (q) {
      const name = (p.nombre || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const catN = (p.categoria || '').toLowerCase();
      if (!name.includes(q) && !catN.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if (sort === 'price_asc') FILTERED.sort((a, b) => (a.precio ?? Infinity) - (b.precio ?? Infinity));
  else if (sort === 'price_desc') FILTERED.sort((a, b) => (b.precio ?? -Infinity) - (a.precio ?? -Infinity));
  else if (sort === 'name_asc') FILTERED.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));

  currentPage = 1;
  renderPage();
}

// ─── RENDER ──────────────────────────────────────────────
function renderPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = FILTERED.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(FILTERED.length / PAGE_SIZE);

  document.getElementById('resultsMeta').innerHTML =
    FILTERED.length
      ? `Mostrando <strong>${start + 1}–${Math.min(start + PAGE_SIZE, FILTERED.length)}</strong> de <strong>${FILTERED.length.toLocaleString('es-CR')}</strong> productos`
      : '';

  const grid = document.getElementById('grid');

  if (!ALL.length) {
    grid.innerHTML = `<div class="center-msg" style="grid-column:1/-1;">
      <div class="icon">📦</div>
      <p>Cargá un archivo JSON generado por los scrapers para ver los productos acá.</p>
    </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  if (!FILTERED.length) {
    grid.innerHTML = `<div class="center-msg" style="grid-column:1/-1;">
      <div class="icon">🔍</div>
      <p>No hay productos que coincidan con ese filtro.</p>
    </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = page.map(p => {
    const precio = p.precio != null
      ? `₡${Number(p.precio).toLocaleString('es-CR')}`
      : null;
    const imgHtml = p.imagen
      ? `<img class="card-img" src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>🖼️</div>'">`
      : `<div class="card-img-placeholder">🖼️</div>`;
    const linkHtml = p.url
      ? `<a class="card-link" href="${p.url}" target="_blank" rel="noopener">Ver producto →</a>`
      : '';
    return `
      <div class="card">
        ${imgHtml}
        <div class="card-body">
          <div class="card-store">${p.negocio || ''}</div>
          <div class="card-name">${p.nombre || ''}</div>
          <div class="card-cat">${p.categoria || ''}</div>
          <div class="card-price ${precio ? '' : 'no-price'}">${precio || 'Precio no disponible'}</div>
          ${linkHtml}
        </div>
      </div>`;
  }).join('');

  // Pagination
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Ant</button>`;
  const range = [];
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) range.push(i);
    else if (range[range.length-1] !== '...') range.push('...');
  }
  range.forEach(p => {
    if (p === '...') html += `<span style="padding:.4rem .4rem;color:var(--muted)">…</span>`;
    else html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Sig →</button>`;
  pag.innerHTML = html;
}

function goPage(n) {
  const totalPages = Math.ceil(FILTERED.length / PAGE_SIZE);
  if (n < 1 || n > totalPages) return;
  currentPage = n;
  renderPage();
  document.querySelector('.main').scrollIntoView({ behavior: 'smooth' });
}

// ─── EVENTS ──────────────────────────────────────────────
// Upload zone
const zone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

zone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files.length) loadFiles(e.target.files); });

zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag');
  if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
});

// Filters
let debounce;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(applyFilters, 250);
});
document.getElementById('filterCat').addEventListener('change', applyFilters);
document.getElementById('filterMaxPrice').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(applyFilters, 400);
});
document.getElementById('sortSelect').addEventListener('change', applyFilters);

// Init
renderPage();
</script>
</body>
</html>
